# My nginx config to host this site
map $cookie_preferredLang $root_lang {
    default en;
    de      de;
    en      en;
}

server {
    listen 80;
    listen [::]:80;
    server_name mathia.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name mathia.xyz;

    ssl_certificate     /etc/letsencrypt/live/mathia.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mathia.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_ecdh_curve      X25519:prime256v1:secp384r1;

    root /var/www/mathia-homepage/dist;
    index index.html;

    location = / {
        return 302 /$root_lang/;
    }

    location ~ ^/(en|de)/about/?$ {
        return 301 /$1/;
    }

    error_page 404 /404.html;

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri $uri/ =404;
    }
}
